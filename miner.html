<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08080a">
    <title>ToastMiner • ToastCoin</title>


<link rel="stylesheet" href="style.css">

<style>
    .miner-page {
        max-width: 900px;
        margin: 0 auto;
        padding: 48px 20px 80px;
    }

    .miner-header {
        text-align: center;
        margin-bottom: 32px;
    }

    .miner-icon {
        font-size: 64px;
        margin-bottom: 12px;
    }

    .miner-title {
        font-size: 38px;
        font-weight: 800;
        letter-spacing: -1.5px;
        margin: 0;
    }

    .miner-subtitle {
        color: #85858e;
        margin-top: 10px;
    }

    .miner-card {
        background: rgba(19, 19, 23, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        padding: 32px;
        box-shadow:
            0 20px 60px rgba(0, 0, 0, 0.35),
            inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .miner-status {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: #85858e;
        margin-bottom: 28px;
    }

    .status-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #555;
    }

    .status-dot.mining {
        background: #e4a03a;
        box-shadow: 0 0 14px rgba(228, 160, 58, 0.7);
    }

    .reward {
        text-align: center;
        font-size: 56px;
        font-weight: 800;
        letter-spacing: -2px;
    }

    .reward span {
        color: #e4a03a;
    }

    .reward-label {
        text-align: center;
        color: #85858e;
        margin-top: 4px;
        margin-bottom: 28px;
    }

    .progress-wrap {
        height: 12px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 12px;
    }

    .progress {
        width: 0%;
        height: 100%;
        background: #e4a03a;
        border-radius: inherit;
        transition: width 0.2s linear;
    }

    .progress-text {
        text-align: center;
        color: #85858e;
        font-size: 14px;
        margin-bottom: 28px;
    }

    .miner-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 28px;
    }

    .stat {
        background: rgba(255, 255, 255, 0.035);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 16px;
        padding: 18px;
        text-align: center;
    }

    .stat-label {
        color: #666;
        font-size: 13px;
        margin-bottom: 7px;
    }

    .stat-value {
        font-size: 18px;
        font-weight: 700;
    }

    .wallet-box {
        margin-bottom: 20px;
    }

    .wallet-box label {
        display: block;
        color: #85858e;
        font-size: 14px;
        margin-bottom: 8px;
    }

    .wallet-input {
        width: 100%;
        box-sizing: border-box;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(0, 0, 0, 0.25);
        color: #f5f5f7;
        outline: none;
        font-size: 15px;
    }

    .wallet-input:focus {
        border-color: rgba(228, 160, 58, 0.5);
    }

    .miner-button {
        width: 100%;
        border: 0;
        border-radius: 14px;
        padding: 15px 20px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        background: #e4a03a;
        color: #111;
        transition:
            transform 0.15s ease,
            opacity 0.15s ease;
    }

    .miner-button:hover {
        transform: translateY(-1px);
    }

    .miner-button:active {
        transform: translateY(1px);
    }

    .miner-button.stop {
        background: rgba(255, 255, 255, 0.08);
        color: #f5f5f7;
    }

    .miner-note {
        text-align: center;
        color: #666;
        font-size: 13px;
        margin-top: 20px;
    }

    @media (max-width: 650px) {
        .miner-stats {
            grid-template-columns: 1fr;
        }

        .reward {
            font-size: 42px;
        }

        .miner-card {
            padding: 22px;
        }
    }
</style>


</head>

<body>


<div class="ambient ambient-one"></div>
<div class="ambient ambient-two"></div>

<header class="navbar">

<a
    href="index.html"
    class="brand"
>
    <span class="brand-icon">🍞</span>

    <span class="brand-text">
        ToastCoin
    </span>

    <span class="testnet-pill">
        TESTNET
    </span>
</a>

<nav class="nav-links">

    <a href="index.html">
        Markets
    </a>

    <a
        href="miner.html"
        class="active"
    >
        ToastMiner
    </a>

    <a href="wallet.html">
        Wallet
    </a>

</nav>

<div class="nav-status">
    <span class="status-dot"></span>
    Network online
</div>

</header>

<main class="miner-page">

    <div class="miner-header">
        <div class="miner-icon">🍞</div>

        <h1 class="miner-title">
            ToastMiner
        </h1>

        <p class="miner-subtitle">
            Mine TOAST on the ToastCoin testnet.
        </p>
    </div>

    <section class="miner-card">

        <div class="miner-status">
            <div
                id="statusDot"
                class="status-dot"
            ></div>

            <span id="status">
                Ready to mine
            </span>
        </div>

        <div class="reward">
            <span id="mined">
                0.0000
            </span>
            TOAST
        </div>

        <div class="reward-label">
            mined this session
        </div>

        <div class="progress-wrap">
            <div
                id="progress"
                class="progress"
            ></div>
        </div>

        <div
            id="progressText"
            class="progress-text"
        >
            0% • 10:00 remaining
        </div>

        <div class="miner-stats">

            <div class="stat">
                <div class="stat-label">
                    Mining rate
                </div>

                <div class="stat-value">
                    100 TOAST / 10 min
                </div>
            </div>

            <div class="stat">
                <div class="stat-label">
                    Hashrate
                </div>

                <div
                    id="hashrate"
                    class="stat-value"
                >
                    0 H/s
                </div>
            </div>

            <div class="stat">
                <div class="stat-label">
                    Time
                </div>

                <div
                    id="time"
                    class="stat-value"
                >
                    10:00
                </div>
            </div>

        </div>

        <div class="wallet-box">

            <label for="wallet">
                ToastCoin wallet address
            </label>

            <input
                id="wallet"
                class="wallet-input"
                type="text"
                placeholder="Enter your testnet wallet address"
            >

        </div>

        <button
            id="mineButton"
            class="miner-button"
        >
            Start Mining
        </button>

        <div class="miner-note">
            ToastMiner is running on the ToastCoin testnet.
        </div>

    </section>

</main>
<script>
    const API =
        "https://toastcoin-exchange.dominikkoba22.workers.dev";

    // Shared with wallet.html and index.html, so one address is used everywhere.
    const WALLET_KEY = "toastWallet";
    const SESSION_KEY = "toastMinerSession";

    // Must match the Worker: 100 TOAST over 600 seconds.
    const DURATION = 600;
    const REWARD = 100;
    const CLAIM_EVERY = 10000;

    const walletInput = document.getElementById("wallet");
    const mineButton = document.getElementById("mineButton");
    const statusText = document.getElementById("status");
    const statusDot = document.getElementById("statusDot");
    const minedElement = document.getElementById("mined");
    const progressElement = document.getElementById("progress");
    const progressText = document.getElementById("progressText");
    const hashrateElement = document.getElementById("hashrate");
    const timeElement = document.getElementById("time");

    let mining = false;
    let sessionId = null;
    let startedAt = 0;
    let timer = null;
    let lastClaim = 0;
    let busy = false;
    let claiming = false;

    function address() {
        return walletInput.value.trim();
    }

    function formatTime(seconds) {
        const total = Math.max(0, Math.ceil(seconds));
        const minutes = Math.floor(total / 60);
        const secs = total % 60;

        return (
            String(minutes).padStart(2, "0") +
            ":" +
            String(secs).padStart(2, "0")
        );
    }

    function setStatus(text, active) {
        statusText.textContent = text;
        statusDot.classList.toggle("mining", Boolean(active));
    }

    async function api(endpoint, options = {}) {
        const response = await fetch(API + endpoint, options);

        let data = {};

        try {
            data = await response.json();
        } catch (error) {
            data = {};
        }

        if (!response.ok) {
            throw new Error(data.error || "Request failed");
        }

        return data;
    }

    function post(endpoint, body) {
        return api(endpoint, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(body)
        });
    }

    function render() {
        const elapsed = Math.min(
            (Date.now() - startedAt) / 1000,
            DURATION
        );

        const percent = (elapsed / DURATION) * 100;
        const remaining = Math.max(0, DURATION - elapsed);

        progressElement.style.width = percent + "%";

        progressText.textContent =
            Math.floor(percent) +
            "% • " +
            formatTime(remaining) +
            " remaining";

        timeElement.textContent = formatTime(remaining);

        minedElement.textContent =
            ((elapsed / DURATION) * REWARD).toFixed(4);

        if (mining) {
            hashrateElement.textContent =
                Math.floor(850 + Math.random() * 350).toLocaleString() +
                " H/s";
        }
    }

    function rememberSession() {
        localStorage.setItem(WALLET_KEY, address());

        localStorage.setItem(
            SESSION_KEY,
            JSON.stringify({
                address: address(),
                sessionId,
                startedAt: Math.floor(startedAt / 1000)
            })
        );
    }

    function forgetSession() {
        localStorage.removeItem(SESSION_KEY);

        sessionId = null;
        startedAt = 0;
        mining = false;
        claiming = false;
        busy = false;

        clearInterval(timer);
        timer = null;

        walletInput.disabled = false;
        mineButton.disabled = false;
        mineButton.classList.remove("stop");
        mineButton.textContent = "Start Mining";

        hashrateElement.textContent = "0 H/s";
    }

    function beginSession() {
        mining = true;
        lastClaim = Date.now();

        setStatus("Mining TOAST...", true);

        mineButton.disabled = false;
        mineButton.textContent = "Stop Mining";
        mineButton.classList.add("stop");

        walletInput.disabled = true;

        clearInterval(timer);
        timer = setInterval(tick, 250);

        render();
    }

    async function claim() {
        if (!sessionId || claiming) {
            return null;
        }

        claiming = true;

        try {
            const data = await post("/api/miner/claim", {
                address: address(),
                sessionId
            });

            minedElement.textContent =
                Number(data.total || 0).toFixed(4);

            return data;

        } catch (error) {
            // A dropped poll is not fatal: the Worker keeps the elapsed
            // time and the next claim catches up.
            console.error("Miner claim failed:", error);
            return null;

        } finally {
            claiming = false;
        }
    }

    async function tick() {
        if (!mining) {
            return;
        }

        render();

        if (Date.now() - lastClaim >= CLAIM_EVERY) {
            lastClaim = Date.now();
            claim();
        }

        if (Date.now() - startedAt >= DURATION * 1000) {
            await settle("complete");
        }
    }

    async function settle(reason) {
        if (!mining) {
            return;
        }

        mining = false;

        clearInterval(timer);
        timer = null;

        mineButton.disabled = true;
        mineButton.textContent = "Claiming...";

        progressElement.style.width = "100%";
        progressText.textContent = "100% • Mining complete";
        timeElement.textContent = "00:00";

        try {
            const data = await post("/api/miner/stop", {
                address: address(),
                sessionId
            });

            const total = Number(data.total || 0);

            minedElement.textContent = total.toFixed(4);

            setStatus(
                reason === "complete"
                    ? "Reward claimed"
                    : "Mining stopped",
                false
            );

            if (reason === "complete" && total > 0) {
                alert(
                    "You mined " +
                    total.toFixed(4) +
                    " TOAST!"
                );
            }

        } catch (error) {
            console.error("Miner stop failed:", error);
            setStatus("Claim failed", false);

        } finally {
            forgetSession();

            if (reason !== "complete") {
                progressElement.style.width = "0%";
                progressText.textContent = "0% • 10:00 remaining";
                timeElement.textContent = "10:00";
                minedElement.textContent = "0.0000";
            }
        }
    }

    async function startMining() {
        if (mining || busy) {
            return;
        }

        const addr = address();

        if (!addr) {
            alert(
                "Enter your ToastCoin wallet address, or create one on the wallet page."
            );

            walletInput.focus();
            return;
        }

        busy = true;
        mineButton.disabled = true;
        mineButton.textContent = "Starting...";

        try {
            const data = await post("/api/miner/start", {
                address: addr
            });

            sessionId = data.sessionId;
            startedAt = Number(data.startedAt) * 1000;

            rememberSession();
            beginSession();

        } catch (error) {
            console.error("Miner start failed:", error);

            setStatus("Unable to start mining", false);

            alert(
                error.message ||
                "Could not start ToastMiner."
            );

        } finally {
            if (!mining) {
                busy = false;
                mineButton.disabled = false;
                mineButton.textContent = "Start Mining";
            }
        }
    }

    mineButton.addEventListener("click", () => {
        if (mining) {
            settle("stopped");
        } else {
            startMining();
        }
    });

    walletInput.addEventListener("change", () => {
        if (mining) {
            return;
        }

        localStorage.setItem(WALLET_KEY, address());
    });


    // Resume a session that was still running when the page was closed.
    // /api/miner/start is idempotent per address, so it returns the live
    // session and its original start time.
    (async function restore() {
        const saved = localStorage.getItem(WALLET_KEY);

        if (saved) {
            walletInput.value = saved;
        }

        let session = null;

        try {
            session = JSON.parse(
                localStorage.getItem(SESSION_KEY) || "null"
            );
        } catch (error) {
            session = null;
        }

        if (!session || !session.sessionId || !session.address) {
            setStatus("Ready to mine", false);
            return;
        }

        walletInput.value = session.address;
        mineButton.disabled = true;
        mineButton.textContent = "Resuming...";

        try {
            const data = await post("/api/miner/start", {
                address: session.address
            });

            sessionId = data.sessionId;
            startedAt = Number(data.startedAt) * 1000;

            rememberSession();

            if (Date.now() - startedAt >= DURATION * 1000) {
                mining = true;
                await settle("complete");
            } else {
                beginSession();
                await claim();
            }

        } catch (error) {
            console.error("Could not resume mining session:", error);

            forgetSession();
            setStatus("Ready to mine", false);
        }
    })();
</script>

</body>
</html>
